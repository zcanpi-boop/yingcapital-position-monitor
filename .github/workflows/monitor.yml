name: Monitor public operation records

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "发送一条 Telegram 测试通知"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: yingcapital-position-monitor
  # 保留当前运行，拥堵时只等待最新一轮，避免过期轮询积压和状态分支并发覆盖。
  queue: single
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    # 为币安重试和 GitHub 平台长尾预留空间；并发组仍保证不会重叠执行。
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore monitor state
        shell: bash
        run: |
          mkdir -p .runtime
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state; then
            while IFS= read -r state_file; do
              if [[ "${state_file}" =~ ^[0-9]+\.json$ ]]; then
                git show "origin/monitor-state:${state_file}" > ".runtime/${state_file}"
              fi
            done < <(git ls-tree -r --name-only origin/monitor-state)
            if [ ! -f .runtime/5075281354358777856.json ] && git cat-file -e origin/monitor-state:state.json 2>/dev/null; then
              # 兼容升级前的熬鹰资本单文件状态，绝不重置原基准。
              git show origin/monitor-state:state.json > .runtime/5075281354358777856.json
            fi
          else
            echo "No state branch yet; each trader will create an independent baseline."
          fi

      - name: Monitor latest operation records
        id: monitor
        if: ${{ !inputs.test_notification }}
        continue-on-error: true
        env:
          TRADERS_CONFIG_PATH: "traders.json"
          MONITOR_TIMEZONE: "America/New_York"
          MONITOR_STATE_DIR: ".runtime"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: "src"
        run: python -m yingcapital_monitor

      - name: Send test notification
        id: notification_test
        if: ${{ inputs.test_notification }}
        continue-on-error: true
        env:
          TRADERS_CONFIG_PATH: "traders.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: "src"
        run: python -m yingcapital_monitor --test-notification

      - name: Persist monitor state
        if: ${{ always() && hashFiles('.runtime/*.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp .runtime/*.json "$publish_dir/"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b monitor-state
          git add *.json
          git commit -m "Update monitor state"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:monitor-state

      - name: Propagate monitor failure
        if: ${{ steps.monitor.outcome == 'failure' || steps.notification_test.outcome == 'failure' }}
        run: exit 1
